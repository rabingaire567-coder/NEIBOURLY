<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#12281f" />
    <title>NEIBOURLY — Help your own people, in your own ward</title>
    <meta
      name="description"
      content="NEIBOURLY is a Nepal-first community help platform. Ask neighbours for help, offer what you know, and find verified local services across all 77 districts."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NEIBOURLY — People helping people, one ward at a time" />
    <meta
      property="og:description"
      content="Ask, offer, discover and connect across Nepal's 7 provinces, 77 districts and 753 local levels."
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = null;
        try {
          var s = JSON.parse(localStorage.getItem('neibourly:v1:settings') || 'null');
          if (s && (s.theme === 'dark' || s.theme === 'light')) t = s.theme;
          if (s && (s.lang === 'ne' || s.lang === 'en')) document.documentElement.lang = s.lang;
        } catch (e) {
          /* storage unavailable */
        }
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 40rem; margin: 4rem auto; padding: 0 1.5rem; font: 16px/1.6 system-ui">
        <h1>NEIBOURLY</h1>
        <p>
          NEIBOURLY needs JavaScript to show community requests, offers and local services near you.
          Please enable JavaScript and reload this page.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
